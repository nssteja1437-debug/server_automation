---
- name: Deploy Python Server Monitoring
  hosts: ec2
  become: true

  tasks:

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/server-automation
        state: directory
        mode: '0755'

    - name: Copy Python monitoring script
      ansible.builtin.copy:
        src: ../python/server_info.py
        dest: /opt/server-automation/server_info.py
        mode: '0755'

    - name: Copy requirements file
      ansible.builtin.copy:
        src: ../requirements.txt
        dest: /opt/server-automation/requirements.txt
        mode: '0644'

    - name: Install Python virtual environment package
      ansible.builtin.apt:
        name: python3-venv
        state: present
        update_cache: true

    - name: Create Python virtual environment
      ansible.builtin.command:
        cmd: python3 -m venv /opt/server-automation/venv
        creates: /opt/server-automation/venv/bin/python

    - name: Install Python dependencies
      ansible.builtin.command:
        cmd: /opt/server-automation/venv/bin/pip install -r /opt/server-automation/requirements.txt

    - name: Create logs directory
      ansible.builtin.file:
        path: /opt/server-automation/logs
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy systemd service file
      ansible.builtin.copy:
        src: myapp.service
        dest: /etc/systemd/system/server-monitor.service
        mode: '0644'
  
    - name: Copy systemd timer file
      ansible.builtin.copy:
        src: server-monitor.timer
        dest: /etc/systemd/system/server-monitor.timer
        mode: '0644'

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start server monitoring service
      ansible.builtin.systemd:
        name: server-monitor.service
        state: started
        enabled: true

    - name: Start monitoring timer
      ansible.builtin.systemd:
        name: server-monitor.timer
        state: started
        enabled: true
        